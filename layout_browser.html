<div id="footer_div" style="z-index:2;">
  <!-- ASCII TABLE {{{ -->
  <div    id="fold_div1" onclick='fold_onclick(1,"");'>
    <img  id="fold_grip1" alt="fold_grip1" class="fold_grip"   src="images/icons/gripper.png">
   <div   id="fold_pane1">
    <img alt="ascii_full"     style="width:715px; height:488px;" src="https://www.asciitable.com/asciifull.gif">
    <img alt="ascii_extended" style="width:573px; height:335px;" src="https://www.asciitable.com/extend.gif">
  </div>
  </div>
  <!-- }}} -->
  <!-- TRANSCRIPT {{{ -->
  <div
   title="Double Click to hide"
   id="transcript2"
   class="transcript"
   ondblclick='this.style.visibility="hidden";'
   onresize='this.style.left="10px"; this.style.top="10px";'
   >
  </div>
  <!-- }}} -->
  <!-- TEXT INPUT {{{ -->
  <div    id="fold_div2">
   <img   id="fold_grip2" alt="fold_grip2" class="fold_grip" src="images/icons/gripper.png" draggable="false" onclick='fold_onclick(2,"");'>
   <em    id="fold_grip4" class="fold_grip" onclick='toggle_to_top_mid_bot("fold_pane2");' title="move input to top or bottom"></em>
   <br>
<!-- input position fixed or static ● keep in viewport while zooming on tablet {{{-->
<script>
let toggle_to_top_mid_bot = function() {

    let className
        = fold_grip4.classList.contains("to_mid") ? "to_top"
        : fold_grip4.classList.contains("to_top") ? "to_bot"
        :                                           "to_mid"; 

    fold_pane2.classList.remove("to_top");
    fold_pane2.classList.remove("to_mid");
    fold_pane2.classList.remove("to_bot");

    fold_grip4.classList.remove("to_top");
    fold_grip4.classList.remove("to_mid");
    fold_grip4.classList.remove("to_bot");

    fold_grip4.classList.add   (className);
    fold_pane2.classList.add   (className);
};
</script>
<!--}}}-->
   <input id="fold_pane2" type="text"                                                        onclick='//fold_onclick(2,"");'
   onkeydown ='fold_keydown (event,this); return false;'
   onkeypress='fold_keypress(event,this); return false;'
   onkeyup   ='fold_keyup   (event,this); return false;'
   onmouseover='this.focus();'
   >
  </div>
  <!-- }}} -->

  <div    id="fold_div3">
